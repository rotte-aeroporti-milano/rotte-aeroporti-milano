name: Aggiorna Rotte Aeree Milano (Bypass Cloudflare)

on:
  schedule:
    - cron: '0 0 * * 1' # Ogni lunedì a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dal tasto "Run workflow"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Google Chrome ed Eventuali Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb libxi6 libgconf-2-4
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium undetected-chromedriver

      - name: Esegui Scraper con Undetected Chromedriver
        run: |
          xvfb-run python scrape.py

      - name: Commit e Push del file CSV su GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rotte_complete.csv
          git commit -m "Aggiornamento rotte Milano con undetected-chromedriver" || exit 0
          git push
