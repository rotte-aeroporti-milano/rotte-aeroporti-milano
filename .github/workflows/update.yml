name: Aggiorna Rotte Aeree

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write  # Concede i permessi necessari per salvare il CSV nella repository

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pandas

      - name: Run Scraper
        run: python scrape.py

      - name: Commit & Push File CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rotte_complete.csv
          git commit -m "Aggiornamento automatico rotte aeree" || exit 0
          git push
