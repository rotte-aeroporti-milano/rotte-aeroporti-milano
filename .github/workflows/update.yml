name: Aggiorna Rotte Aeree Milano

on:
  schedule:
    - cron: '0 0 * * 1' # Esegue ogni lunedì a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dal tasto "Run workflow"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pandas

      - name: Esegui Scraper
        run: python scrape.py

      - name: Commit e Push su GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rotte_complete.csv
          git commit -m "Aggiornamento rotte Milano" || exit 0
          git push
