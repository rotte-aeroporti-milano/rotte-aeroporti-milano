name: Aggiorna Rotte Aeree Milano (Bypass Cloudflare)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Configura Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Installa Xvfb (Display Virtuale)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium undetected-chromedriver

      - name: Esegui Scraper con Undetected Chromedriver
        run: |
          xvfb-run python scrape.py

      - name: Commit e Push del file CSV su GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rotte_complete.csv
          git commit -m "Aggiornamento rotte Milano con undetected-chromedriver" || exit 0
          git push
